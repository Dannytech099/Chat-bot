    function esc(str) {
      return String(str ?? "").replace(/[&<>"']/g, (m) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m]));

    function handleContactSubmit(e) {
      e.preventDefault();
      const fd = new FormData(e.target);
      state.leads.unshift({
        id: "L-" + (101 + state.leads.length),
        name: fd.get("fullName"),
        email: fd.get("email"),
        company: fd.get("company") || "Independent",
        service: fd.get("serviceInterest"),
        budget: fd.get("budgetRange"),
        message: fd.get("message"),
        status: "NEW"
      });
      state.contactSuccess = true;
      render();
    }

      const lead = state.leads.find(l => l.id === leadId);
      if (!lead) return;
      state.proposal.clientName = lead.name;
      state.proposal.clientCompany = lead.company;
      state.proposal.clientEmail = lead.email;
      state.proposal.projectTitle = lead.service + " Engagement";
      state.proposal.status = "DRAFT";
      state.proposal.signedName = "";
      state.proposal.signedAt = "";
      lead.status = "PROPOSAL_SENT";
      state.dashTab = "proposals";
      render();
    }

    async function generateAiDraft(e) {
      e.preventDefault();
      const fd = new FormData(e.target);
      const platform = fd.get("platform");
      const niche = fd.get("niche");
      const audience = fd.get("audience");
      const objective = fd.get("objective");
      const topic = fd.get("topic");

      if (state.openAiKey.trim().startsWith("sk-")) {
        state.aiNotice = "Calling OpenAI API...";
        render();
        try {
          const resp = await fetch("https://api.openai.com/v1/chat/completions", {
            method: "POST",
            headers: { "Content-Type": "application/json", "Authorization": "Bearer " + state.openAiKey.trim() },
            body: JSON.stringify({
              model: "gpt-4o-mini",
              response_format: { type: "json_object" },
              messages: [
                { role: "system", content: 'Return JSON: {"title":"string","headline":"string","body":"string","hashtags":["#tag"]}' },
                { role: "user", content: `Write a ${platform} post for niche "${niche}", audience "${audience}", objective "${objective}", topic "${topic}", tone "${state.brandVoice.tone}". CTA: "${state.brandVoice.cta}".` }
              ]
            })
          });
          const data = await resp.json();
          const parsed = JSON.parse(data.choices[0].message.content);
          state.contentItems.unshift({
            id: "c" + Date.now(),
            title: parsed.title,
            platform,
            headline: parsed.headline,
            body: parsed.body,
            hashtags: parsed.hashtags || [],
            status: "DRAFT",
            date: new Date().toISOString().split("T")[0]
          });
          state.aiNotice = "Live LLM draft generated and added to Content Library!";
        } catch (err) {
          state.aiNotice = "Live API call failed (" + err.message + "). Check your key or browser CORS.";
        }
        render();
        return;
      }

      // Honest Template Preview Mode when no API key is provided
      state.contentItems.unshift({
        id: "c" + Date.now(),
        title: `[Template Draft] ${topic.slice(0, 42)}`,
        platform,
        headline: `Why ${audience} are rethinking ${topic.slice(0, 35)}`,
        body: `[PREVIEW TEMPLATE — Connect OPENAI_API_KEY above or in Next.js .env for live AI copywriting]\n\nCore Angle for ${platform}:\n• Audience: ${audience}\n• Niche: ${niche}\n• Objective: ${objective}\n• Topic Brief: ${topic}\n\nCTA: ${state.brandVoice.cta}`,
        hashtags: ["#DigitalSystems", "#WorkflowAutomation", "#Growth"],
        status: "DRAFT",
        date: new Date().toISOString().split("T")[0]
      });
      state.aiNotice = "Created structured Template Preview draft (enter an OpenAI API key in Brand Voice for live AI copywriting).";
      render();
    }

          hashtags: src.hashtags,
          status: "DRAFT",

      });
      state.aiNotice = "Repurposed top post into X, Instagram, and Email variations.";

                <span class="font-bold text-white">${esc(l.name)}</span>
                <span class="text-xs text-slate-400">(${esc(l.company)})</span>
                <span class="rounded bg-blue-500/20 px-2 py-0.5 text-[10px] text-blue-300">${l.status}</span>
              </div>
              <p class="text-xs text-purple-300">${esc(l.service)} • ${esc(l.budget)} • ${esc(l.email)}</p>
              <p class="text-xs text-slate-400">${esc(l.message)}</p>
            </div>
            <div class="flex items-center gap-2">
              <select onchange="state.leads[${idx}].status=this.value;render()" class="rounded-lg bg-slate-950 border border-white/15 px-2.5 py-1.5 text-xs">
                ${["NEW","QUALIFIED","PROPOSAL_SENT","WON","LOST"].map(s=>`<option ${l.status===s?"selected":""}>${s}</option>`).join("")}
              </select>
              <button onclick="createProposalFromLead('${l.id}')" class="rounded-xl grad px-3.5 py-2 text-xs font-semibold text-white cursor-pointer">Draft Proposal →</button>
            </div>
          </div>
        `).join("")}
      </div>`;
    }

    function renderServiceMenu() {
      return `
      <div class="space-y-6">
        <h1 class="text-2xl font-bold text-white">Project 3A: Commercial Service Menu (12 Services)</h1>
        <div class="grid gap-4 md:grid-cols-2">
          ${SERVICES.map(s => `
            <div class="glass rounded-2xl p-5 space-y-3">
              <div class="flex justify-between items-start">
                <div>
                  <span class="text-[10px] font-mono text-purple-400">${s.cat}</span>
                  <h2 class="font-bold text-white">${s.name}</h2>
                </div>
                <span class="text-xs font-mono text-emerald-400">From $${s.price.toLocaleString()}</span>
              </div>
              <p class="text-xs text-slate-300">${s.desc}</p>
              <div class="grid grid-cols-3 gap-2 pt-2">
                ${s.tiers.map(t => `<div class="rounded-lg bg-white/5 p-2 text-center text-[11px]"><div class="text-slate-400">${t.t}</div><div class="font-bold text-white">$${t.p.toLocaleString()}</div></div>`).join("")}
              </div>
            </div>
          `).join("")}
        </div>
      </div>`;
    }

    function renderProposalSystem() {
      const p = state.proposal;
      return `
      <div class="space-y-6">
        <div class="no-print flex flex-wrap items-center justify-between gap-3 glass rounded-2xl p-4">
          <div>
            <span class="text-xs font-mono text-purple-400">${p.number} • ${p.status}</span>
            <h1 class="text-lg font-bold text-white">Project 3B: 13-Section Editable PDF Proposal</h1>
          </div>
          <div class="flex flex-wrap gap-2">
            <button onclick="signAndConvertProposal()" class="rounded-xl bg-emerald-600 px-4 py-2 text-xs font-semibold text-white cursor-pointer">Simulate Client Sign & Convert to Project</button>
            <button onclick="window.print()" class="rounded-xl grad px-4 py-2 text-xs font-semibold text-white cursor-pointer">Export / Print PDF</button>
          </div>
        </div>

        <div class="print-sheet glass rounded-2xl p-8 space-y-6">
          <div class="border-b border-white/10 pb-5 space-y-2">
            <div class="text-xs font-mono text-purple-400">01. COVER PAGE — ${p.number}</div>
            <input value="${esc(p.projectTitle)}" onchange="state.proposal.projectTitle=this.value" class="w-full bg-transparent text-2xl font-extrabold text-white" />
            <p class="text-xs text-slate-400">Prepared For: <strong>${esc(p.clientName)}</strong> (${esc(p.clientCompany)})</p>
          </div>
          ${[
            ["02. Executive Summary", "executiveSummary", p.executiveSummary],
            ["03. Client Business Overview", "clientOverview", p.clientOverview],
            ["04. Identified Business Challenges", "challenges", p.challenges],
            ["05. Proposed Solution", "solution", p.solution],
            ["06. Project Scope", "scope", p.scope],
            ["07. Deliverables", "deliverables", p.deliverables],
            ["08. Implementation Timeline", "timeline", p.timeline],
            ["11. Maintenance & Support", "maintenance", p.maintenance],
            ["12. Terms & Conditions", "terms", p.terms]
          ].map(([label, key, val]) => `
            <div>
              <h2 class="text-sm font-bold text-white mb-1.5">${label}</h2>
              <textarea rows="2" onchange="state.proposal['${key}']=this.value" class="w-full rounded-xl border border-white/10 bg-black/25 p-2.5 text-xs text-slate-200">${esc(val)}</textarea>
            </div>
          `).join("")}

          <div class="grid sm:grid-cols-2 gap-4 pt-2">
            <div class="rounded-xl border border-white/10 p-4">
              <div class="text-xs text-slate-400">09. Project Investment (USD)</div>
              <input type="number" value="${p.investmentUsd}" onchange="state.proposal.investmentUsd=Number(this.value);render()" class="mt-1 bg-transparent text-xl font-bold text-emerald-400 w-36" />
            </div>
            <div class="rounded-xl border border-white/10 p-4 text-xs space-y-1">
              <div class="font-bold text-white">10. Payment Milestones</div>
              <div>40% Kickoff: $${Math.round(p.investmentUsd * 0.4).toLocaleString()}</div>
              <div>30% Staging: $${Math.round(p.investmentUsd * 0.3).toLocaleString()}</div>
              <div>30% Launch: $${Math.round(p.investmentUsd * 0.3).toLocaleString()}</div>
            </div>
          </div>

          <div class="border-t border-white/10 pt-5 space-y-2">
            <div class="text-xs font-bold text-white">13. Acceptance & Electronic Signature</div>
            ${p.signedName ? `
              <p class="text-xs text-emerald-300">Accepted & signed by <strong>${esc(p.signedName)}</strong> on ${p.signedAt}</p>
            ` : `
              <div class="no-print flex gap-2">
                <input id="prop-sign-input" value="${esc(p.clientName)}" class="rounded-lg border border-white/15 bg-black/40 px-3 py-1.5 text-xs text-white" />
                <button onclick="signAndConvertProposal()" class="rounded-lg grad px-4 py-1.5 text-xs font-semibold text-white cursor-pointer">Sign & Launch Project</button>
              </div>
            `}
          </div>
        </div>
      </div>`;
    }

    function renderDeliveryPack() {
      const prj = state.project;
      const phaseDocs = prj.docs.filter(d => d.phase === state.deliveryPhase);
      const activeDoc = prj.docs[state.selectedDocIdx] || phaseDocs[0];
      return `
      <div class="space-y-6">
        <div class="no-print flex flex-wrap justify-between items-center gap-3">
          <div>
            <span class="text-xs font-mono text-purple-400">${prj.code} • ${prj.client}</span>
            <h1 class="text-2xl font-bold text-white">Project 4: Client Delivery Pack (24 Docs)</h1>
          </div>
          <button onclick="window.print()" class="rounded-xl grad px-4 py-2 text-xs font-semibold text-white cursor-pointer">Print / Export Document PDF</button>
        </div>

        <!-- Milestones -->
        <div class="no-print glass rounded-2xl p-4">
          <p class="text-xs font-semibold text-white mb-2">Live Project Milestone Tracker</p>
          <div class="grid sm:grid-cols-4 gap-2">
            ${prj.milestones.map((m, i) => `
              <div class="rounded-xl bg-white/5 p-3 space-y-1.5">
                <div class="text-xs font-semibold text-white">${m.title}</div>
                <select onchange="state.project.milestones[${i}].status=this.value;render()" class="w-full rounded bg-slate-950 border border-white/15 px-2 py-1 text-[11px]">
                  ${["PENDING","IN_PROGRESS","AWAITING_APPROVAL","COMPLETED"].map(s=>`<option ${m.status===s?"selected":""}>${s}</option>`).join("")}
                </select>
              </div>
            `).join("")}
          </div>
        </div>

        <!-- Phase Tabs -->
        <div class="no-print flex flex-wrap gap-2">
          ${[["ONBOARDING","A. Onboarding (6)"],["PROJECT_MANAGEMENT","B. Project Management (6)"],["FINAL_DELIVERY","C. Final Delivery (7)"],["POST_DELIVERY","D. Post-Delivery (5)"]].map(([k,l])=>`
            <button onclick="state.deliveryPhase='${k}';state.selectedDocIdx=state.project.docs.findIndex(d=>d.phase==='${k}');render()" class="rounded-xl px-3.5 py-2 text-xs font-semibold cursor-pointer ${state.deliveryPhase===k?"grad text-white":"bg-white/5 text-slate-300"}">${l}</button>
          `).join("")}
        </div>

        <div class="grid lg:grid-cols-12 gap-5">
          <div class="no-print lg:col-span-4 space-y-1.5">
            ${phaseDocs.map(d => `
              <button onclick="state.selectedDocIdx=${d.id};render()" class="w-full text-left rounded-xl p-3 text-xs cursor-pointer ${activeDoc.id===d.id?"bg-purple-500/20 border border-purple-500/50 text-white":"bg-white/5 text-slate-300"}">
                <div class="font-semibold">${d.title}</div>
                <div class="text-[10px] text-slate-400 mt-0.5">${d.status}</div>
              </button>
            `).join("")}
          </div>

          <div class="lg:col-span-8 print-sheet glass rounded-2xl p-6 space-y-4">
            <div class="flex justify-between items-center">
              <h2 class="font-bold text-white">${activeDoc.title}</h2>
              <select onchange="state.project.docs[${activeDoc.id}].status=this.value;render()" class="no-print rounded bg-slate-950 border border-white/15 px-2 py-1 text-xs">
                ${["DRAFT","SENT_TO_CLIENT","CLIENT_COMPLETED","APPROVED"].map(s=>`<option ${activeDoc.status===s?"selected":""}>${s}</option>`).join("")}
              </select>
            </div>
            <div class="rounded-xl bg-blue-500/10 border border-blue-500/20 p-3 text-xs text-blue-200"><strong>Instructions:</strong> ${activeDoc.instructions}</div>
            <textarea rows="10" onchange="state.project.docs[${activeDoc.id}].content=this.value" class="w-full rounded-xl border border-white/10 bg-black/30 p-3 text-xs font-mono text-slate-200">${esc(activeDoc.content)}</textarea>
            ${activeDoc.requiresSig ? `<div class="border-t border-white/10 pt-3 text-xs text-slate-400">Approval Signature Field: _____________________________</div>` : ""}
          </div>
        </div>

        <!-- Interactive Post-Delivery Survey -> Publishes to Public Website Testimonials -->
        <form onsubmit="submitSurvey(event)" class="no-print glass rounded-2xl p-6 space-y-3">
          <h2 class="font-bold text-white text-sm">Interactive Client Satisfaction Survey (Syncs Live to Website Testimonials)</h2>
          <div class="grid sm:grid-cols-3 gap-3">
            <input name="clientName" required value="${esc(state.proposal.clientName)}" placeholder="Client Name" class="rounded-xl border border-white/15 bg-black/40 px-3 py-2 text-xs text-white" />
            <input name="clientRole" required value="Founder & Managing Partner" placeholder="Role / Title" class="rounded-xl border border-white/15 bg-black/40 px-3 py-2 text-xs text-white" />
            <select name="rating" class="rounded-xl border border-white/15 bg-slate-950 px-3 py-2 text-xs text-white">
              <option value="5">5 Stars — Exceptional</option>
              <option value="4">4 Stars — Very Good</option>
            </select>
          </div>
          <textarea name="quote" required rows="2" placeholder="Write honest client review..." class="w-full rounded-xl border border-white/15 bg-black/40 px-3 py-2 text-xs text-white">Clear milestones, structured handover docs, and fast automated lead handling from day one.</textarea>
          <button type="submit" class="rounded-xl bg-emerald-600 px-5 py-2 text-xs font-semibold text-white cursor-pointer">Submit & Publish to Website Testimonials</button>
        </form>
      </div>`;
    }

    function render() {
      const bSite = document.getElementById("btn-mode-site");
      const bDash = document.getElementById("btn-mode-dash");
      bSite.className = "rounded-lg px-3.5 py-1.5 text-xs font-semibold transition cursor-pointer " + (state.mode === "website" ? "grad text-white" : "text-slate-300 hover:text-white");
      bDash.className = "rounded-lg px-3.5 py-1.5 text-xs font-semibold transition cursor-pointer " + (state.mode === "dashboard" ? "grad text-white" : "text-slate-300 hover:text-white");
      document.getElementById("app").innerHTML = state.mode === "website" ? renderWebsite() : renderDashboard();
    }

    render();
  </script>
</body>
</html>
